name: Benchmark HuggingFace Models

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Discover models
        run: python3 scripts/discover_models.py
      - name: Classify pairs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/classify_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: classified
          path: scripts/classified.json

  benchmark_group1:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: classified
          path: scripts/
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_GROUP: group1
        run: python3 scripts/benchmark_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-group1
          path: scripts/results.json

  benchmark_group2:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: classified
          path: scripts/
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_GROUP: group2
        run: python3 scripts/benchmark_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-group2
          path: scripts/results.json

  benchmark_group3:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: classified
          path: scripts/
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_GROUP: group3
        run: python3 scripts/benchmark_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-group3
          path: scripts/results.json

  merge_and_update:
    needs: [benchmark_group1, benchmark_group2, benchmark_group3]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: scripts/
      - name: Merge results
        run: |
          mv scripts/classified/classified.json scripts/classified.json || true
          mv scripts/results-group1/results.json scripts/results-group1.json || true
          mv scripts/results-group2/results.json scripts/results-group2.json || true
          mv scripts/results-group3/results.json scripts/results-group3.json || true
          python3 scripts/merge_results.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db
          git diff --cached --quiet || (git commit -m "Update benchmark results [skip ci]" && git push)
